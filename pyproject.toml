[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-mcp"
version = "0.1.0"
description = "MCP server that enforces GAIN-Coding workflow gates as code — guiding the agent through reviewed, policy-compliant interactions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.scripts]
gate-mcp = "gate_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
